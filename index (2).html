<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Buddy AI - Asisten Animasi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">

<style>
/* ============================
   RESET & VARIABEL
   ============================ */
:root {
    --bg: #0f172a;
    --bg-card: #1e293b;
    --text: #f1f5f9;
    --text-dim: #94a3b8;
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.4);
    --green: #4ade80;
    --red: #f87171;
    --orange: #fb923c;
    --pink: #f472b6;
    --avatar-skin: #38bdf8;
    --avatar-dark: #0284c7;
    --radius: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
}

/* ============================
   PARTIKEL BACKGROUND
   ============================ */
#particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
}

/* ============================
   HEADER
   ============================ */
.app-header {
    position: relative; z-index: 10;
    text-align: center;
    padding: 1rem;
    background: rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(56, 189, 248, 0.2);
}
.app-header h1 { font-size: 1.3rem; margin-bottom: 0.4rem; }
.status-bar { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
.badge {
    font-size: 0.75rem;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    background: var(--bg-card);
    border: 1px solid rgba(255,255,255,0.1);
}
.badge.online { border-color: var(--green); color: var(--green); }
.badge.offline { border-color: var(--red); color: var(--red); }

/* ============================
   AVATAR ANIMASI
   ============================ */
.avatar-container {
    position: relative; z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.5rem 0 0.5rem;
    flex-shrink: 0;
}

.avatar {
    position: relative;
    width: 140px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.3s;
}
.avatar:hover { transform: scale(1.05); }

.head {
    width: 120px; height: 110px;
    background: linear-gradient(135deg, var(--avatar-skin), var(--avatar-dark));
    border-radius: 50% 50% 45% 45%;
    position: relative;
    box-shadow: 0 0 30px var(--accent-glow), inset 0 -5px 15px rgba(0,0,0,0.2);
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}

.antenna {
    position: absolute;
    top: -25px; left: 50%;
    transform: translateX(-50%);
    width: 4px; height: 25px;
    background: var(--avatar-dark);
    border-radius: 2px;
}
.antenna-ball {
    position: absolute;
    top: -8px; left: 50%;
    transform: translateX(-50%);
    width: 14px; height: 14px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--green);
    animation: pulse-glow 1.5s ease-in-out infinite;
}
@keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 5px var(--green); transform: translateX(-50%) scale(1); }
    50% { box-shadow: 0 0 20px var(--green); transform: translateX(-50%) scale(1.3); }
}

.eyes {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-top: 30px;
}
.eye {
    width: 28px; height: 28px;
    background: white;
    border-radius: 50%;
    position: relative;
    animation: blink 4s ease-in-out infinite;
}
.eye.right { animation-delay: 0.1s; }

@keyframes blink {
    0%, 42%, 46%, 100% { transform: scaleY(1); }
    44% { transform: scaleY(0.05); }
}

.pupil {
    width: 14px; height: 14px;
    background: #1e293b;
    border-radius: 50%;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    transition: all 0.2s;
}
.pupil::after {
    content: '';
    width: 5px; height: 5px;
    background: white;
    border-radius: 50%;
    position: absolute;
    top: 2px; right: 2px;
}

.avatar.happy .eye { border-radius: 50%; }
.avatar.surprised .eye { width: 34px; height: 34px; }
.avatar.thinking .eye.left { animation: none; transform: scaleY(0.6); }

.mouth {
    width: 30px; height: 12px;
    background: #0f172a;
    border-radius: 0 0 20px 20px;
    margin: 12px auto 0;
    transition: all 0.15s;
}

.mouth.speaking {
    animation: talk 0.3s ease-in-out infinite alternate;
}
@keyframes talk {
    0% { height: 8px; width: 25px; border-radius: 0 0 15px 15px; }
    50% { height: 18px; width: 20px; border-radius: 50%; }
    100% { height: 10px; width: 30px; border-radius: 0 0 20px 20px; }
}

.avatar.happy .mouth {
    width: 40px; height: 16px;
    border-radius: 0 0 25px 25px;
}
.avatar.surprised .mouth {
    width: 20px; height: 20px;
    border-radius: 50%;
}
.avatar.thinking .mouth {
    width: 15px; height: 8px;
    border-radius: 50%;
    margin-left: 35px;
}

.cheek {
    width: 18px; height: 10px;
    background: rgba(244, 114, 182, 0.4);
    border-radius: 50%;
    position: absolute;
    bottom: 25px;
}
.cheek.left { left: 10px; }
.cheek.right { right: 10px; }
.avatar.happy .cheek { background: rgba(244, 114, 182, 0.7); }

.body {
    width: 80px; height: 50px;
    background: linear-gradient(135deg, var(--avatar-dark), #0369a1);
    border-radius: 10px 10px 20px 20px;
    margin-top: -5px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}
.body-light {
    width: 16px; height: 16px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--green);
    animation: pulse-glow 2s ease-in-out infinite;
}
.body-light.listening {
    background: var(--orange);
    box-shadow: 0 0 15px var(--orange);
    animation: pulse-glow 0.5s ease-in-out infinite;
}
.body-light.speaking-light {
    background: var(--accent);
    box-shadow: 0 0 15px var(--accent);
}

.mood-label {
    margin-top: 0.75rem;
    font-size: 0.9rem;
    color: var(--accent);
    text-align: center;
    min-height: 1.5em;
}

/* ============================
   CHAT AREA
   ============================ */
.chat-container {
    position: relative; z-index: 5;
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem 1rem;
    scroll-behavior: smooth;
}
.chat-messages {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    padding-bottom: 1rem;
}
.msg { display: flex; }
.msg.user { justify-content: flex-end; }
.msg.buddy { justify-content: flex-start; }

.bubble {
    max-width: 80%;
    padding: 0.75rem 1rem;
    border-radius: var(--radius);
    font-size: 0.95rem;
    line-height: 1.5;
    animation: pop-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes pop-in {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

.msg.buddy .bubble {
    background: var(--bg-card);
    border: 1px solid rgba(56, 189, 248, 0.2);
    border-bottom-left-radius: 4px;
}
.msg.user .bubble {
    background: var(--accent);
    color: var(--bg);
    font-weight: 500;
    border-bottom-right-radius: 4px;
}

/* ============================
   INPUT AREA
   ============================ */
.input-area {
    position: relative; z-index: 10;
    padding: 0.75rem 1rem;
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(56, 189, 248, 0.2);
}
.input-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
}
#user-input {
    flex: 1;
    padding: 0.75rem 1rem;
    border: 1px solid rgba(56, 189, 248, 0.3);
    border-radius: 12px;
    background: var(--bg-card);
    color: var(--text);
    font-size: 1rem;
    outline: none;
}
#user-input:focus { border-color: var(--accent); }
#user-input::placeholder { color: var(--text-dim); }

.btn-icon {
    width: 48px; height: 48px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: var(--bg);
    font-size: 1.3rem;
    cursor: pointer;
}
.btn-icon:active { transform: scale(0.9); }

.action-row { display: flex; gap: 0.5rem; }
.btn-voice, .btn-stop {
    flex: 1;
    padding: 0.75rem;
    border: 2px solid var(--accent);
    border-radius: 12px;
    background: transparent;
    color: var(--accent);
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
}
.btn-voice:active, .btn-stop:active { transform: scale(0.95); }
.btn-voice.listening {
    background: var(--orange);
    border-color: var(--orange);
    color: var(--bg);
    animation: pulse-btn 1s infinite;
}
@keyframes pulse-btn {
    0%, 100% { box-shadow: 0 0 0 0 rgba(251, 146, 60, 0.5); }
    50% { box-shadow: 0 0 0 10px rgba(251, 146, 60, 0); }
}
.btn-stop {
    border-color: var(--red);
    color: var(--red);
}
.hidden { display: none !important; }

.chat-container::-webkit-scrollbar { width: 6px; }
.chat-container::-webkit-scrollbar-track { background: transparent; }
.chat-container::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

@media (max-width: 480px) {
    .app-header h1 { font-size: 1.1rem; }
    .avatar { transform: scale(0.85); }
}
</style>
</head>
<body>

<canvas id="particles"></canvas>

<header class="app-header">
    <h1>🤖 Buddy AI</h1>
    <div class="status-bar">
        <span id="network-status" class="badge online">🟢 Online</span>
        <span id="voice-status" class="badge">🔇 Diam</span>
    </div>
</header>

<div class="avatar-container">
    <div class="avatar" id="avatar">
        <div class="head">
            <div class="antenna"><div class="antenna-ball"></div></div>
            <div class="eyes">
                <div class="eye left"><div class="pupil"></div></div>
                <div class="eye right"><div class="pupil"></div></div>
            </div>
            <div class="mouth" id="mouth"></div>
            <div class="cheek left"></div>
            <div class="cheek right"></div>
        </div>
        <div class="body">
            <div class="body-light" id="body-light"></div>
        </div>
    </div>
    <p class="mood-label" id="mood-label">😊 Siap membantu!</p>
</div>

<main class="chat-container" id="chat-container">
    <div class="chat-messages" id="chat-messages">
        <div class="msg buddy">
            <div class="bubble">Halo! Saya Buddy 🤖 Tekan tombol 🎤 untuk bicara, atau ketik pesan di bawah!</div>
        </div>
    </div>
</main>

<div class="input-area">
    <div class="input-row">
        <input type="text" id="user-input" placeholder="Ketik pesan Anda..." autocomplete="off">
        <button id="btn-send" class="btn-icon" title="Kirim">➤</button>
    </div>
    <div class="action-row">
        <button id="btn-voice" class="btn-voice">🎤 <span>Tekan & Bicara</span></button>
        <button id="btn-stop" class="btn-stop hidden">⏹ <span>Berhenti</span></button>
    </div>
</div>

<script>
// =============================================
//  KONFIGURASI - ISI API KEY GROQ ANDA DI SINI
//  Daftar gratis di: https://console.groq.com
// =============================================
const CONFIG = {
    AI_API_KEY: '', // <-- PASTE API KEY GROQ ANDA DI SINI
    AI_API_URL: 'https://api.groq.com/openai/v1/chat/completions',
    AI_MODEL: 'llama-3.3-70b-versatile',
    AI_SYSTEM_PROMPT: 'Kamu adalah Buddy, asisten AI ramah yang menjawab singkat dan jelas dalam Bahasa Indonesia. Jawab maksimal 2-3 kalimat.',
    VOICE_LANG: 'id-ID',
    VOICE_RATE: 1.0,
};

// =============================================
//  DATABASE OFFLINE (Untuk saat tidak ada internet)
// =============================================
const OFFLINE_DATA = [
  {
    keywords: ["halo", "hai", "hi", "hey", "selamat pagi", "selamat siang", "selamat malam"],
    responses: ["Halo! Senang bertemu Anda! Ada yang bisa saya bantu?", "Hai! Saya Buddy, siap membantu Anda!", "Halo! Apa kabar? Tanyakan apa saja!"]
  },
  {
    keywords: ["siapa kamu", "siapa nama", "kamu siapa"],
    responses: ["Saya Buddy, asisten AI yang hidup di browser Anda!", "Nama saya Buddy! Saya web app AI yang bisa bicara dan mendengar."]
  },
  {
    keywords: ["jam berapa", "waktu", "tanggal", "hari ini"],
    responses: ["__TIME__"]
  },
  {
    keywords: ["lelucon", "lucu", "joke", "humor", "ketawa"],
    responses: [
      "Kenapa programmer suka gelap? Karena mereka benci bugs yang datang ke cahaya! 😄",
      "Apa bedanya WiFi dan cinta? WiFi perlu password, cinta perlu kepercayaan! 😂",
      "Kenapa komputer tidak pernah lapar? Karena sudah punya banyak bytes! 🤣"
    ]
  },
  {
    keywords: ["motivasi", "semangat", "sedih", "putus asa"],
    responses: [
      "Ingat, setiap ahli pernah menjadi pemula. Anda sudah hebat! 💪",
      "Kegagalan bukan akhir, itu guru terbaik. Terus melangkah! 🌟",
      "Anda lebih kuat dari yang Anda pikirkan. 🌈"
    ]
  },
  {
    keywords: ["cpr", "jantung", "pingsan"],
    responses: ["Untuk henti jantung: Tekan dada 5-6 cm, 100-120x/menit. Telepon 118/119!"]
  },
  {
    keywords: ["terima kasih", "makasih", "thanks"],
    responses: ["Sama-sama! Senang bisa membantu! 😊", "Tidak masalah! Ada lagi yang bisa dibantu?"]
  },
  {
    keywords: ["offline", "tanpa internet"],
    responses: ["Ya, saya bisa offline! Semua animasi & suara saya tersimpan di perangkat Anda. 😎"]
  }
];

// =============================================
//  STATE & ELEMEN DOM
// =============================================
let isOnline = navigator.onLine;
let isSpeaking = false;
let isListening = false;

const $ = id => document.getElementById(id);
const avatar = $('avatar');
const mouth = $('mouth');
const bodyLight = $('body-light');
const moodLabel = $('mood-label');
const chatMessages = $('chat-messages');
const chatContainer = $('chat-container');
const userInput = $('user-input');
const btnSend = $('btn-send');
const btnVoice = $('btn-voice');
const btnStop = $('btn-stop');
const networkStatus = $('network-status');
const voiceStatus = $('voice-status');

// =============================================
//  SOUND FX (Web Audio API)
// =============================================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

function playTone(freq, duration, type = 'sine', volume = 0.15) {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
}

const sfxMessage = () => { playTone(880, 0.15); setTimeout(() => playTone(1100, 0.1), 100); };
const sfxListen = () => playTone(440, 0.3, 'triangle', 0.1);
const sfxStop = () => playTone(330, 0.2, 'triangle', 0.1);

// =============================================
//  AVATAR CONTROLLER
// =============================================
function setMood(mood, text) {
    avatar.className = 'avatar ' + mood;
    moodLabel.textContent = text;
}

function startSpeakingAnim() {
    mouth.classList.add('speaking');
    bodyLight.classList.add('speaking-light');
    setMood('happy', '🗣️ Sedang bicara...');
    voiceStatus.textContent = '🔊 Bicara';
    isSpeaking = true;
    btnStop.classList.remove('hidden');
}

function stopSpeakingAnim() {
    mouth.classList.remove('speaking');
    bodyLight.classList.remove('speaking-light');
    setMood('happy', '😊 Siap membantu!');
    voiceStatus.textContent = '🔇 Diam';
    isSpeaking = false;
    btnStop.classList.add('hidden');
}

function startListeningAnim() {
    bodyLight.classList.add('listening');
    setMood('surprised', '👂 Mendengarkan...');
    voiceStatus.textContent = '🎤 Mendengar';
    isListening = true;
    btnVoice.classList.add('listening');
}

function stopListeningAnim() {
    bodyLight.classList.remove('listening');
    setMood('happy', '😊 Siap membantu!');
    voiceStatus.textContent = '🔇 Diam';
    isListening = false;
    btnVoice.classList.remove('listening');
}

function setThinkingAnim() { setMood('thinking', '🤔 Berpikir...'); }

// =============================================
//  TEXT-TO-SPEECH
// =============================================
function speak(text) {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = CONFIG.VOICE_LANG;
    utter.rate = CONFIG.VOICE_RATE;
    const voices = window.speechSynthesis.getVoices();
    const idVoice = voices.find(v => v.lang.startsWith('id'));
    if (idVoice) utter.voice = idVoice;

    utter.onstart = () => { startSpeakingAnim(); sfxMessage(); };
    utter.onend = () => stopSpeakingAnim();
    utter.onerror = () => stopSpeakingAnim();
    utter.onboundary = (e) => {
        if (e.name === 'word') {
            mouth.classList.remove('speaking');
            void mouth.offsetWidth;
            mouth.classList.add('speaking');
        }
    };
    window.speechSynthesis.speak(utter);
}

function stopSpeaking() {
    window.speechSynthesis.cancel();
    stopSpeakingAnim();
    sfxStop();
}

// =============================================
//  SPEECH-TO-TEXT (Mendengar Suara)
// =============================================
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;

if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = CONFIG.VOICE_LANG;
    recognition.interimResults = false;
    recognition.continuous = false;

    recognition.onresult = (e) => {
        const text = e.results[0][0].transcript;
        stopListeningAnim();
        sfxStop();
        addMessage(text, 'user');
        processInput(text);
    };

    recognition.onerror = (e) => {
        stopListeningAnim();
        if (e.error === 'not-allowed') {
            addMessage('⚠️ Izin mikrofon ditolak. Buka pengaturan browser.', 'buddy');
        }
    };

    recognition.onend = () => { if (isListening) stopListeningAnim(); };
}

function startListening() {
    if (!recognition) {
        addMessage('⚠️ Browser tidak mendukung suara. Pakai Chrome.', 'buddy');
        return;
    }
    if (isSpeaking) stopSpeaking();
    sfxListen();
    startListeningAnim();
    recognition.start();
}

// =============================================
//  CHAT UI
// =============================================
function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = `msg ${sender}`;
    div.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
    chatMessages.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
    if (sender === 'buddy') sfxMessage();
}

function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
}

// =============================================
//  AI PROCESSING (Online + Offline)
// =============================================
async function processInput(text) {
    setThinkingAnim();

    if (isOnline && CONFIG.AI_API_KEY) {
        try {
            const response = await fetch(CONFIG.AI_API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${CONFIG.AI_API_KEY}`
                },
                body: JSON.stringify({
                    model: CONFIG.AI_MODEL,
                    messages: [
                        { role: 'system', content: CONFIG.AI_SYSTEM_PROMPT },
                        { role: 'user', content: text }
                    ],
                    max_tokens: 200,
                    temperature: 0.7
                })
            });
            const data = await response.json();
            if (data.choices && data.choices[0]) {
                const reply = data.choices[0].message.content;
                addMessage(reply, 'buddy');
                speak(reply);
                return;
            }
        } catch (err) {
            console.log('API error, fallback offline:', err);
        }
    }

    const reply = getOfflineResponse(text);
    addMessage(reply, 'buddy');
    speak(reply);
}

function getOfflineResponse(input) {
    const lower = input.toLowerCase();

    for (const item of OFFLINE_DATA) {
        for (const keyword of item.keywords) {
            if (lower.includes(keyword.toLowerCase())) {
                let resp = item.responses[Math.floor(Math.random() * item.responses.length)];
                if (resp === '__TIME__') {
                    const now = new Date();
                    return `Sekarang pukul ${now.toLocaleTimeString('id-ID')} pada ${now.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'})}.`;
                }
                return resp;
            }
        }
    }

    const fallbacks = [
        'Hmm, saya belum tahu jawabannya secara offline. Hubungkan internet untuk AI penuh!',
        'Pertanyaan menarik! Saya sedang offline. Sambungkan internet agar lebih pintar.',
        'Maaf, saya tidak mengerti. Coba tanya: waktu, lelucon, motivasi, atau sapaan!',
    ];
    return fallbacks[Math.floor(Math.random() * fallbacks.length)];
}

// =============================================
//  PARTIKEL BACKGROUND
// =============================================
function initParticles() {
    const canvas = $('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const COUNT = 40;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    for (let i = 0; i < COUNT; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 2 + 0.5,
            dx: (Math.random() - 0.5) * 0.5,
            dy: (Math.random() - 0.5) * 0.5,
            alpha: Math.random() * 0.5 + 0.1
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(56, 189, 248, ${p.alpha})`;
            ctx.fill();
            p.x += p.dx; p.y += p.dy;
            if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
            if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
        });
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const dist = Math.hypot(particles[i].x - particles[j].x, particles[i].y - particles[j].y);
                if (dist < 120) {
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.strokeStyle = `rgba(56, 189, 248, ${0.1 * (1 - dist / 120)})`;
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(draw);
    }
    draw();
}

// =============================================
//  NETWORK DETECTION
// =============================================
function updateNetworkStatus() {
    isOnline = navigator.onLine;
    if (isOnline) {
        networkStatus.textContent = '🟢 Online';
        networkStatus.className = 'badge online';
    } else {
        networkStatus.textContent = '🔴 Offline';
        networkStatus.className = 'badge offline';
    }
}

window.addEventListener('online', () => {
    updateNetworkStatus();
    addMessage('🟢 Koneksi kembali! AI penuh aktif.', 'buddy');
});

window.addEventListener('offline', () => {
    updateNetworkStatus();
    addMessage('🔴 Offline. Database lokal aktif!', 'buddy');
});

// =============================================
//  INIT
// =============================================
function init() {
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    updateNetworkStatus();
    initParticles();

    btnSend.addEventListener('click', () => {
        const text = userInput.value.trim();
        if (!text) return;
        userInput.value = '';
        addMessage(text, 'user');
        processInput(text);
    });

    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') btnSend.click();
    });

    btnVoice.addEventListener('click', () => {
        if (isListening) {
            recognition?.stop();
            stopListeningAnim();
            sfxStop();
        } else {
            startListening();
        }
    });

    btnStop.addEventListener('click', stopSpeaking);

    // Sapaan awal (tunda agar user bisa interaksi dulu - kebijakan browser)
    setTimeout(() => {
        addMessage('Klik layar atau tekan tombol untuk mengaktifkan suara! 🔊', 'buddy');
    }, 500);
}

document.addEventListener('DOMContentLoaded', init);
</script>
